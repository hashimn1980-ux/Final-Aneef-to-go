<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANEEF | Private Institutional Guardian</title>
    
    <!-- Fonts: Playfair Display, Public Sans, Manrope, Noto Kufi Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Noto+Kufi+Arabic:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Icons: Material Symbols Outlined (Variable Font) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              navy: {
                DEFAULT: 'rgb(var(--bg-primary) / <alpha-value>)',
                light: 'rgb(var(--bg-secondary) / <alpha-value>)',
                lighter: 'rgb(var(--bg-tertiary) / <alpha-value>)',
                dark: 'rgb(var(--bg-quaternary) / <alpha-value>)',
              },
              white: 'rgb(var(--text-main) / <alpha-value>)', // Inverts: White in Dark Mode, Navy in Light Mode
              copper: {
                DEFAULT: '#B7795C',
                light: '#d49a7d',
                dim: '#8A5A44',
              },
              gold: {
                 DEFAULT: '#ec9213',
                 light: '#f7d668',
                 dark: '#b08609',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Public Sans"', 'sans-serif'],
              display: ['"Manrope"', 'sans-serif'],
              arabic: ['"Noto Kufi Arabic"', 'sans-serif'],
            },
            backgroundImage: {
              'gold-gradient': 'linear-gradient(110deg, #bf953f 0%, #b38728 20%, #fcf6ba 45%, #fbf5b7 55%, #b38728 80%, #bf953f 100%)',
              'gold-text-gradient': 'linear-gradient(to right, #ec9213, #fcd34d, #ec9213)',
            },
            animation: {
              'shine': 'shine 4s linear infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flash': 'flash 0.6s ease-out forwards',
              'fade-in': 'fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              shine: {
                '0%': { backgroundPosition: '0% 50%' },
                '100%': { backgroundPosition: '-200% 50%' },
              },
              flash: {
                '0%': { opacity: '0' },
                '10%': { opacity: '1' },
                '100%': { opacity: '0' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(20px)', filter: 'blur(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)', filter: 'blur(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* DARK THEME (DEFAULT) */
        --bg-primary: 15 40 68;      /* #0F2844 */
        --bg-secondary: 26 46 69;    /* #1a2e45 */
        --bg-tertiary: 37 59 86;     /* #253b56 */
        --bg-quaternary: 10 28 48;   /* #0A1C30 */
        --text-main: 255 255 255;    /* White */
      }

      .light-mode {
        /* LIGHT THEME (Cream/Paper) */
        --bg-primary: 247 244 238;   /* #F7F4EE (Warm Cream) */
        --bg-secondary: 255 255 255; /* White */
        --bg-tertiary: 235 230 220;  /* Darker Cream */
        --bg-quaternary: 225 220 210;
        --text-main: 15 40 68;       /* Navy Blue Text */
      }

      body {
        background-color: rgb(var(--bg-primary));
        color: rgb(var(--text-main));
        text-rendering: optimizeLegibility;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      /* Invert white logos in light mode to make them dark */
      .light-mode .invert-on-light {
        filter: invert(1);
      }

      /* Enforce Thin Luxury Icons */
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 200,
        'GRAD' 0,
        'opsz' 24;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--bg-primary));
      }
      ::-webkit-scrollbar-thumb {
        background: #B7795C;
        border-radius: 3px;
      }

      /* Gold Foil Text Utility */
      .text-gold-foil {
        background: linear-gradient(110deg, #bf953f 10%, #fcf6ba 18%, #bf953f 22%, #b38728 35%, #fcf6ba 45%, #aa771c 55%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
      }

      /* Hide Scrollbar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Lens Interaction Cursor Hiding */
      .lens-active {
        cursor: none !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
